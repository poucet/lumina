[package]
name = "llm"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
llm_macros = { workspace = true }
schemars = { workspace = true }
config = { workspace = true }
chrono = { workspace = true }
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"], optional = true }

# Pure-Rust local embedding stack (no onnxruntime / C++ dylibs).
# candle versions kept aligned with simply-voice.
candle = { version = "0.9.1", package = "candle-core", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true }
# default-features off: drops `onig` (C) and esaxx `cpp`; fancy-regex is the
# pure-Rust regex backend.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
hf-hub = { version = "0.4.3", optional = true }

[features]
default = ["local-embedding"]
local-embedding = [
    "dep:candle",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
ts = ["dep:ts-rs"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
