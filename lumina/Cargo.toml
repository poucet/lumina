[package]
name = "lumina"
version.workspace = true
edition.workspace = true
description = "Lumina — Discord bot for the Simply platform"

[[bin]]
name = "lumina"
path = "src/main.rs"

[features]
default = ["embedded"]
embedded = ["dep:simply-daemon"]

[dependencies]
# Internal crates
config = { workspace = true }
lumina-macros = { workspace = true }
simply-daemon-api = { workspace = true }
simply-daemon = { workspace = true, optional = true }
simply-rpc = { workspace = true }
mcp-gdocs = { workspace = true, features = ["skill"] }

# Discord
serenity = { workspace = true }
songbird = { workspace = true }
symphonia = { version = "0.5", features = ["wav", "pcm"] }

# Voice
simply-voice = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Encoding
base64 = { workspace = true }
urlencoding = "2"

# Error handling
anyhow = { workspace = true }

# Per-message tool-state store (lumina-owned, separate from noema.db)
rusqlite = { version = "0.34", features = ["bundled"] }

# Auto-registration
inventory = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Random
rand = "0.9"

# MCP server
rmcp = { workspace = true, features = ["server", "macros"] }
schemars = { workspace = true }
