# Lumina configuration
#
# Copy this file to ~/.local/share/noema/config/lumina.toml
# and fill in your Discord bot token.

[discord]
bot_token = ""
owner_id = 0
guild_ids = []
# status_channel_id = 0
# ai_chats_category_id = 0
history_limit = 1000
# model_id = ""

[voice]
# STT provider ID — use /voice stt to pick one, /voice list to see them all
# stt_provider = "whisper"
# stt_provider = "voxtral"

# TTS provider ID
# tts_provider = "voxtral"

# TTS voice ID — use /voice voice to list available voices
# tts_voice = ""

# Seconds a voice stage (stt, llm, tts, playback) may stay in flight before
# the watchdog DMs the owner
# watchdog_secs = 30
