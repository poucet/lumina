[package]
name = "simply-daemon"
version.workspace = true
edition.workspace = true
description = "Simply platform daemon — trait-based API with in-process and remote implementations"

[features]
default = []
whisper = ["simply-voice/whisper"]
pocket-tts = ["simply-voice/pocket-tts"]
kyutai = ["simply-voice/kyutai"]
# Apple Silicon acceleration for the local-model voice providers.
voice-metal = ["simply-voice/metal"]

[lib]
name = "simply_daemon"
path = "src/lib.rs"

[[bin]]
name = "simply-daemon"
path = "src/main.rs"

[dependencies]
# Internal crates
config = { workspace = true }
simply-core = { workspace = true, features = ["sqlite", "ts"] }
simply-daemon-api = { workspace = true, features = ["ts"] }
simply-rpc = { workspace = true, features = ["ts"] }
simply-voice = { workspace = true, features = ["voxtral", "gemini", "elevenlabs"] }
llm = { workspace = true, features = ["local-embedding"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization / schemas
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Encoding
base64 = { workspace = true }

# Error handling
anyhow = { workspace = true }

# OAuth / HTTP client
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = "0.9"
urlencoding = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# MCP protocol
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }

# TypeScript type generation
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }

# HTTP/WS server
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower-http = { workspace = true }
tower-service = { workspace = true }
http-body-util = { workspace = true }

[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = { workspace = true }
glob = "0.3"
